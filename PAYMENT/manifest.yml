# -------------------------------
# Secret (CONFIDENTIAL - BASE64)
# -------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: payment-secret
  namespace: roboshop
  labels:
    component: payment
    tier: backend
    project: roboshop
type: Opaque
data:
  AMQP_USER: cm9ib3Nob3A=
  AMQP_PASS: cm9ib3Nob3AxMjM=
---
# -------------------------------
# ConfigMap (NON-CONFIDENTIAL)
# -------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: roboshop
  labels:
    component: payment
    tier: backend
    project: roboshop
data:
  CART_HOST: cart
  CART_PORT: "8080"
  USER_HOST: user
  USER_PORT: "8080"
  AMQP_HOST: rabbitmq
---
# -------------------------------
# Payment Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    tier: backend
    project: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      component: payment
      tier: backend
      project: roboshop
  template:
    metadata:
      labels:
        component: payment
        tier: backend
        project: roboshop
    spec:
      containers:
      - name: payment
        image: joindevops/payment:v1
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: payment-config
        - secretRef:
            name: payment-secret
---
# -------------------------------
# Payment Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels:
    component: payment
    tier: backend
    project: roboshop
spec:
  type: ClusterIP
  selector:
    component: payment
    tier: backend
    project: roboshop
  ports:
  - port: 8080
    targetPort: 8080
