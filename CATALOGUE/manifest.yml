# -------------------------------
# ConfigMap
# -------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-config
  namespace: roboshop
  labels:
    component: catalogue
    tier: backend
    project: roboshop
data:
  MONGO: "true"
  MONGO_URL: mongodb://mongodb:27017/catalogue
---
# -------------------------------
# Catalogue Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    component: catalogue
    tier: backend
    project: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      component: catalogue
      tier: backend
      project: roboshop
  template:
    metadata:
      labels:
        component: catalogue
        tier: backend
        project: roboshop
    spec:
      containers:
      - name: catalogue
        image: joindevops/catalogue:v1
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: catalogue-config
---
# -------------------------------
# Catalogue Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    component: catalogue
    tier: backend
    project: roboshop
spec:
  type: ClusterIP
  selector:
    component: catalogue
    tier: backend
    project: roboshop
  ports:
  - port: 8080
    targetPort: 8080
