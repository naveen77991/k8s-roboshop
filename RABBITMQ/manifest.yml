# -------------------------------
# Secret (CONFIDENTIAL - BASE64)
# -------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: roboshop
  labels:
    component: rabbitmq
    tier: db
    project: roboshop
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: cm9ib3Nob3A=
  RABBITMQ_DEFAULT_PASS: cm9ib3Nob3AxMjM=
---
# -------------------------------
# RabbitMQ Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    component: rabbitmq
    tier: db
    project: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      component: rabbitmq
      tier: db
      project: roboshop
  template:
    metadata:
      labels:
        component: rabbitmq
        tier: db
        project: roboshop
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        ports:
        - containerPort: 5672
        envFrom:
        - secretRef:
            name: rabbitmq-secret
---
# -------------------------------
# RabbitMQ Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    component: rabbitmq
    tier: db
    project: roboshop
spec:
  type: ClusterIP
  selector:
    component: rabbitmq
    tier: db
    project: roboshop
  ports:
  - port: 5672
    targetPort: 5672
