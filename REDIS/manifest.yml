# -------------------------------
# Redis Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    component: redis
    tier: db
    project: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      component: redis
      tier: db
      project: roboshop
  template:
    metadata:
      labels:
        component: redis
        tier: db
        project: roboshop
    spec:
      containers:
      - name: redis
        image: redis:7.0
        ports:
        - containerPort: 6379
---
# -------------------------------
# Redis Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    component: redis
    tier: db
    project: roboshop
spec:
  type: ClusterIP
  selector:
    component: redis
    tier: db
    project: roboshop
  ports:
  - port: 6379
    targetPort: 6379
